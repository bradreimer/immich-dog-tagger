[project]
name = "immich-dog-tagger"
version = "0.9.1"
description = "AI-assisted dog detection and tagging for Immich"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.0",
    "truststore>=0.10.4",
    "ultralytics>=8.4.100",
    "pi-heif>=1.4.0",
    "pillow>=12.3.0",
    "open-clip-torch>=3.3.0",
    "fastapi>=0.139.2",
    "uvicorn>=0.51.0",
    "httpx2>=2.9.0",
]

[project.scripts]
immich-dog-tagger = "immich_dog_tagger.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.15.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
torchvision = { index = "pytorch-cu132" }