server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://dog-tagger:8000/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Batch operations (e.g. stale-detection repair) run synchronously
        # over many assets and can take several minutes; nginx's 60s default
        # would otherwise 504 the client while the backend keeps working.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}