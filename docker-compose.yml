services:
  dog-tagger:
    build:
      context: .
      network: host
    image: immich-dog-tagger:latest
    container_name: immich-dog-tagger
    restart: unless-stopped

    environment:
      # Pass internal paths to app (overrides host .env if necessary)
      - STATE_DIR=/app/state
      - CACHE_DIR=/app/cache
      - YOLO_MODEL=/app/models/yolo11n.pt
      - CROP_PADDING=${CROP_PADDING:-0.15}

    volumes:
      # Host Path : Container Path
      - ${HOST_STATE_DIR:-./data/state}:/app/state
      - ${HOST_CACHE_DIR:-./data/cache}:/app/cache
      - ${HOST_MODEL_DIR:-./data/models}:/app/models

    env_file:
      - .env

    entrypoint: ["uvicorn"]

    command:
      [
        "immich_dog_tagger.api.app:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]

    networks:
      - proxy

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities:
                - gpu

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  dog-tagger-ui:
    build:
      context: ./ui
      network: host

    image: immich-dog-tagger-ui:latest
    container_name: immich-dog-tagger-ui

    depends_on:
      - dog-tagger

    networks:
      - proxy

networks:
  proxy:
    external: true