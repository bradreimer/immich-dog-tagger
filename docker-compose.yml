services:
  dog-tagger:
    build:
      context: .
      network: host
    image: immich-dog-tagger:latest
    container_name: immich-dog-tagger
    restart: unless-stopped

    env_file:
      - .env

    entrypoint: ["uvicorn"]

    command:
      [
        "immich_dog_tagger.api.app:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]

    volumes:
      - ${DOG_TAGGER_STATE_DIR}:/app/state
      - ${DOG_TAGGER_CACHE_DIR}:/app/cache
      - ${DOG_TAGGER_MODEL_PATH}:/models/yolo11n.pt

    networks:
      - proxy

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities:
                - gpu

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  dog-tagger-ui:
    build:
      context: ./ui
      network: host

    image: immich-dog-tagger-ui:latest
    container_name: immich-dog-tagger-ui

    depends_on:
      - dog-tagger

    networks:
      - proxy

networks:
  proxy:
    external: true