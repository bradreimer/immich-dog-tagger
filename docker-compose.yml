services:
  dog-tagger:
    image: ghcr.io/bradreimer/immich-dog-tagger:latest
    pull_policy: always
    container_name: immich-dog-tagger
    restart: unless-stopped

    environment:
      # Legacy single-account configuration. Superseded by the mounted CONFIG_FILE below when
      # that file exists -- see config.example.json and docs/deployment.md. Left in place so an
      # existing deployment that hasn't created a config.json keeps working unchanged.
      - IMMICH_URL=${IMMICH_URL:-}
      - IMMICH_EXTERNAL_URL=${IMMICH_EXTERNAL_URL:-}
      - IMMICH_API_KEY=${IMMICH_API_KEY:-}
      - IMMICH_TIMEOUT_SECONDS=${IMMICH_TIMEOUT_SECONDS:-60}
      - CONFIG_FILE=/app/config/config.json
      - STATE_DIR=/app/state
      - CACHE_DIR=/app/cache
      - YOLO_MODEL=/app/models/yolo11m.pt
      - CROP_PADDING=${CROP_PADDING:-0.15}

    volumes:
      - ${HOST_STATE_DIR:-./data/state}:/app/state
      - ${HOST_CACHE_DIR:-./data/cache}:/app/cache
      - ${HOST_MODEL_DIR:-./data/models}:/app/models
      # Optional: copy config.example.json to this host path and mount it here to configure
      # Immich (URL, accounts) as structured JSON instead of the IMMICH_* variables above. If
      # the host file doesn't exist, this mounts an empty directory and the app falls back to
      # the IMMICH_* variables with no error -- see docs/deployment.md.
      - ${HOST_CONFIG_FILE:-./data/config.json}:/app/config/config.json:ro

    ports:
      - "8000:8000"

    entrypoint: ["uvicorn"]
    command:
      [
        "immich_dog_tagger.api.app:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

    # Have an NVIDIA GPU with the nvidia-container-toolkit installed? Uncomment to use it
    # (CPU works fine without this, just slower on detect/classify):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities:
    #             - gpu

  dog-tagger-ui:
    image: ghcr.io/bradreimer/immich-dog-tagger-ui:latest
    pull_policy: always
    container_name: immich-dog-tagger-ui
    restart: unless-stopped
    depends_on:
      - dog-tagger

    ports:
      - "8080:80"
